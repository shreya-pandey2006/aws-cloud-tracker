<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AWS Cloud Clubs — AKGEC Live Member App</title>
  <meta name="theme-color" content="#0B0F19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0B0F19;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 16px;
    }
    .status-card {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }
    .status-card.active {
      background: linear-gradient(135deg, #064E3B, #065F46);
      border-color: #10B981;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 30px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #10B981; }
    input:checked + .slider:before { transform: translateX(22px); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .cell {
      background: #111827;
      border: 1px solid #1E293B;
      padding: 12px;
      border-radius: 12px;
    }
    .cell-label { font-size: 10px; color: #64748B; font-weight: 700; letter-spacing: 0.5px; }
    .cell-val { font-size: 15px; font-weight: 700; color: #E2E8F0; margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
    #mini-map {
      height: 220px;
      width: 100%;
      border-radius: 16px;
      border: 1px solid #1E293B;
      margin-bottom: 18px;
      background: #0B1120;
    }
    .btn-sos {
      width: 100%;
      padding: 16px;
      background: #EF4444;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
      transition: transform 0.1s;
    }
    .btn-sos:active { transform: scale(0.98); }
    .auth-overlay {
      position: fixed; inset: 0; background: #0B0F19; z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-box {
      background: #111827; border: 1px solid #1E293B; border-radius: 20px;
      padding: 24px; width: 100%; max-width: 400px;
    }
    .auth-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px;
    }
    .auth-tab {
      padding: 8px; border: 1px solid #334155; background: #0F172A; color: #94A3B8;
      border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center;
    }
    .auth-tab.active {
      background: #10B981; color: white; border-color: #10B981;
    }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 11px; color: #94A3B8; margin-bottom: 4px; font-weight: 600; }
    .input-group input {
      width: 100%; padding: 10px 12px; background: #0B0F19; border: 1px solid #334155;
      border-radius: 8px; color: white; font-size: 13px; outline: none;
    }
    .btn-submit {
      width: 100%; padding: 12px; background: #10B981; border: none;
      border-radius: 10px; color: white; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px;
    }
    .error-msg {
      padding: 8px 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px; color: #FCA5A5; font-size: 12px; margin-bottom: 12px; display: none;
    }
  </style>
</head>
<body>
  <!-- Auth Overlay -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-box">
      <div style="text-align: center; margin-bottom: 16px;">
        <div style="width: 44px; height: 44px; background: #10B981; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px;">
          📍
        </div>
        <h2 style="font-size: 18px; font-weight: 800;">AWS Cloud Clubs</h2>
        <p style="font-size: 11px; color: #38BDF8; font-weight: 600;">Ajay Kumar Garg Engineering College</p>
      </div>

      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Sign In</div>
        <div id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">New Member</div>
      </div>

      <div id="auth-error" class="error-msg"></div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="event.preventDefault(); handleLogin();">
        <div class="input-group">
          <label>Club Passcode</label>
          <input type="text" id="login-club-code" placeholder="AKGEC2026" required />
        </div>
        <div class="input-group">
          <label>Member Email</label>
          <input type="email" id="login-email" placeholder="student@akgec.ac.in" required />
        </div>
        <div class="input-group">
          <label>Password</label>
          <div style="position: relative;">
            <input type="password" id="login-password" placeholder="••••••••" required style="padding-right: 40px;" />
            <button type="button" onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: #94A3B8; display: flex; align-items: center; padding: 4px;" title="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Sign In & Track</button>
      </form>

      <!-- Register Form -->
      <form id="form-register" style="display: none;" onsubmit="event.preventDefault(); handleRegister();">
        <div class="input-group">
          <label>Club Passcode</label>
          <input type="text" id="reg-club-code" placeholder="AKGEC2026" required />
        </div>
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="Your Name" required />
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" placeholder="your.name@akgec.ac.in" required />
        </div>
        <div class="input-group">
          <label>Phone Number (Optional)</label>
          <input type="tel" id="reg-phone" placeholder="+91 98765 43210" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <div style="position: relative;">
            <input type="password" id="reg-password" placeholder="••••••••" required style="padding-right: 40px;" />
            <button type="button" onclick="togglePasswordVisibility('reg-password', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: #94A3B8; display: flex; align-items: center; padding: 4px;" title="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Register as Club Member</button>
      </form>
    </div>
  </div>

  <!-- Main Mobile App Interface -->
  <div class="container">
    <div class="header">
      <div>
        <h1 style="font-size: 16px; font-weight: 800;" id="member-name">Member Portal</h1>
        <p style="font-size: 11px; color: #64748B;" id="club-title">AWS Cloud Clubs • AKGEC</p>
      </div>
      <button onclick="handleLogout()" style="background:#1E293B; border:1px solid #334155; color:#EF4444; padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;">Logout</button>
    </div>

    <!-- Live Sharing Toggle Card -->
    <div id="status-card" class="status-card">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div id="pulse-dot" style="width: 10px; height: 10px; border-radius: 50%; background: #94A3B8;"></div>
          <span id="status-label" style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px;">SHARING PAUSED</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="share-toggle" onchange="toggleSharing(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <p id="status-desc" style="font-size: 11px; color: #94A3B8; line-height: 1.4;">
        Your location is private. Toggle the switch to share your live GPS coordinates with Club HQ.
      </p>
    </div>

    <!-- Live Telemetry Grid -->
    <div class="grid">
      <div class="cell">
        <div class="cell-label">LATITUDE</div>
        <div class="cell-val" id="val-lat">--</div>
      </div>
      <div class="cell">
        <div class="cell-label">LONGITUDE</div>
        <div class="cell-val" id="val-lng">--</div>
      </div>
      <div class="cell">
        <div class="cell-label">SPEED</div>
        <div class="cell-val" id="val-speed">0.0 km/h</div>
      </div>
      <div class="cell">
        <div class="cell-label">GPS ACCURACY</div>
        <div class="cell-val" id="val-acc">Acquiring...</div>
      </div>
    </div>

    <!-- Mini OpenStreetMap -->
    <div id="mini-map"></div>

    <!-- SOS Panic Button -->
    <button class="btn-sos" onclick="triggerSos()">
      <span>🚨</span>
      <span>EMERGENCY SOS DISTRESS</span>
    </button>
  </div>

  <script>
    let currentMember = null;
    let socket = null;
    let map = null;
    let marker = null;
    let isSharing = false;
    let watchId = null;
    let currentLat = null;
    let currentLng = null;

    function switchAuthTab(tab) {
      const errBox = document.getElementById('auth-error');
      errBox.style.display = 'none';
      if (tab === 'login') {
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById('form-login').style.display = 'block';
        document.getElementById('form-register').style.display = 'none';
      } else {
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('form-login').style.display = 'none';
        document.getElementById('form-register').style.display = 'block';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const eyeOpen = btn.querySelector('.eye-open');
      const eyeClosed = btn.querySelector('.eye-closed');
      if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        input.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    }

    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const PHONE_REGEX = /^\+?[0-9\s-]{10,15}$/;

    function showError(msg) {
      const errBox = document.getElementById('auth-error');
      errBox.innerText = msg;
      errBox.style.display = 'block';
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const clubCode = document.getElementById('login-club-code').value.trim();

      if (!clubCode || clubCode.length < 3) {
        showError('Please enter a valid Club Passcode (e.g. AKGEC2026)');
        return;
      }
      if (!email || !EMAIL_REGEX.test(email)) {
        showError('Please enter a valid email address (e.g. name@akgec.ac.in)');
        return;
      }
      if (!password || password.length < 6) {
        showError('Password must be at least 6 characters long');
        return;
      }

      try {
        const res = await fetch('/api/auth/member/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, clubCode })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        currentMember = data.user;
        localStorage.setItem('member_token', data.token);
        localStorage.setItem('member_user', JSON.stringify(currentMember));

        document.getElementById('auth-overlay').style.display = 'none';
        initApp();
      } catch (err) {
        showError(err.message);
      }
    }

    async function handleRegister() {
      const clubCode = document.getElementById('reg-club-code').value.trim();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!clubCode || clubCode.length < 3) {
        showError('Please enter a valid Club Passcode (e.g. AKGEC2026)');
        return;
      }
      if (!name || name.length < 2) {
        showError('Full name must be at least 2 characters');
        return;
      }
      if (!email || !EMAIL_REGEX.test(email)) {
        showError('Please enter a valid email address (e.g. name@akgec.ac.in)');
        return;
      }
      if (phone && !PHONE_REGEX.test(phone)) {
        showError('Phone number must be a valid 10-15 digit number');
        return;
      }
      if (!password || password.length < 6) {
        showError('Password must be at least 6 characters long');
        return;
      }

      try {
        const res = await fetch('/api/auth/member/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clubCode, name, email, phone, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        currentMember = data.user;
        localStorage.setItem('member_token', data.token);
        localStorage.setItem('member_user', JSON.stringify(currentMember));

        document.getElementById('auth-overlay').style.display = 'none';
        initApp();
      } catch (err) {
        showError(err.message);
      }
    }

    function handleLogout() {
      localStorage.removeItem('member_token');
      localStorage.removeItem('member_user');
      location.reload();
    }

    function initApp() {
      document.getElementById('member-name').innerText = currentMember.name;
      document.getElementById('club-title').innerText = `${currentMember.club_name || 'AWS Cloud Clubs'} • ${currentMember.role || 'Member'}`;

      const defaultCenter = [28.6757, 77.5020]; // AKGEC Campus

      if (!map) {
        map = L.map('mini-map', { zoomControl: false }).setView(defaultCenter, 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      }

      socket = io();
      socket.emit('join', {
        clubId: currentMember.club_id,
        memberId: currentMember.id,
        role: 'member'
      });

      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(updatePos, err => console.warn(err), { enableHighAccuracy: true });
      }
    }

    function updatePos(pos) {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      const speed = (pos.coords.speed || 0) * 3.6;
      const acc = pos.coords.accuracy || 5;

      document.getElementById('val-lat').innerText = currentLat.toFixed(5);
      document.getElementById('val-lng').innerText = currentLng.toFixed(5);
      document.getElementById('val-speed').innerText = speed.toFixed(1) + ' km/h';
      document.getElementById('val-acc').innerText = '±' + acc.toFixed(1) + ' m';

      if (map) {
        if (!marker) {
          marker = L.marker([currentLat, currentLng]).addTo(map);
        } else {
          marker.setLatLng([currentLat, currentLng]);
        }
        map.setView([currentLat, currentLng]);
      }

      if (isSharing && socket && currentMember) {
        socket.emit('location:update', {
          memberId: currentMember.id,
          clubId: currentMember.club_id,
          latitude: currentLat,
          longitude: currentLng,
          accuracy: acc,
          speed: speed,
          heading: pos.coords.heading || 0,
          battery: 100
        });
      }
    }

    function toggleSharing(checked) {
      isSharing = checked;
      const card = document.getElementById('status-card');
      const dot = document.getElementById('pulse-dot');
      const label = document.getElementById('status-label');
      const desc = document.getElementById('status-desc');

      if (isSharing) {
        card.classList.add('active');
        dot.style.background = '#34D399';
        label.innerText = 'LIVE SHARING ACTIVE';
        label.style.color = '#34D399';
        desc.innerText = 'Your real-time GPS coordinates are streaming to Club HQ Dispatch.';

        if ('geolocation' in navigator) {
          watchId = navigator.geolocation.watchPosition(updatePos, null, {
            enableHighAccuracy: true,
            maximumAge: 3000
          });
        }
      } else {
        card.classList.remove('active');
        dot.style.background = '#94A3B8';
        label.innerText = 'SHARING PAUSED';
        label.style.color = '#94A3B8';
        desc.innerText = 'Your location is private. Toggle the switch to share your live coordinates.';

        if (watchId) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
      }

      if (socket && currentMember) {
        socket.emit('location:toggle', {
          memberId: currentMember.id,
          clubId: currentMember.club_id,
          enabled: isSharing
        });
      }
    }

    function triggerSos() {
      if (!confirm('Are you sure you want to broadcast an EMERGENCY SOS to the Club Admin?')) return;

      if (socket && currentMember && currentLat && currentLng) {
        socket.emit('member:sos', {
          memberId: currentMember.id,
          clubId: currentMember.club_id,
          latitude: currentLat,
          longitude: currentLng,
          message: `EMERGENCY SOS: Member ${currentMember.name} pressed panic distress!`
        });
        alert('🚨 Emergency SOS transmitted to Club HQ!');
      } else {
        alert('Unable to transmit SOS: GPS location not yet acquired.');
      }
    }

    // Check existing login session
    const saved = localStorage.getItem('member_user');
    if (saved) {
      try {
        currentMember = JSON.parse(saved);
        document.getElementById('auth-overlay').style.display = 'none';
        window.onload = initApp;
      } catch (e) {
        localStorage.removeItem('member_user');
      }
    }
  </script>
</body>
</html>
