services:
  - type: web
    name: akgec-aws-cloud-tracker
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore # Closest region to India / Ghaziabad
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
