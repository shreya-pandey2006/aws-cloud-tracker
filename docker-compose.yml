version: '3.8'

services:
  club-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akgec-aws-cloud-tracker
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=akgec_aws_cloud_club_secret_key_2026
    volumes:
      - tracker-data:/app/server/data

volumes:
  tracker-data:
    driver: local
